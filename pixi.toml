[workspace]
name = "ljosbru"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-aarch64", "linux-64", "win-64"]
exclude-newer = "7d"

[tasks]
build = "cargo build --features gui"
test = "cargo test --features gui"
gui = "cargo run --release --features gui --bin ljosbru-gui"

[target.osx-arm64.tasks]
bundle-macos = "bash scripts/macos/bundle-app.sh"

[dependencies]
rust = "*"
pkg-config = "*"

[target.linux.dependencies]
compilers = ">=1.7.0"
wayland = "*"
libegl-devel = "*"
libgbm = "*"

[feature.lint.dependencies]
pre-commit = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
[feature.lint.tasks]
pre-commit-install = "pre-commit install"
lint = "pre-commit run -a"

[environments]
default = ["lint"]
